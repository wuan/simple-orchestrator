name: Environment images

# Builds the turn environment flavours in `environments/Dockerfile` and
# publishes them to the GitHub Container Registry. Every `FROM base AS <name>`
# stage in that Dockerfile is a flavour; adding one there is the only edit
# needed. Pull requests build but do not push, so an image change is validated
# before it lands on `main`.
#
# Pushes to `main` and version tags always build, because the SDK version baked
# into the image comes from `package-lock.json` and can change without
# `environments/` changing. Pull requests build only when an image input moved.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'environments/**'
      - '.github/workflows/environments.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Discover the flavours from the Dockerfile so the workflow and the image set
  # can never drift: adding a `FROM base AS <name>` stage is enough.
  flavours:
    name: Discover flavours
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.discover.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - name: Discover `FROM base AS <flavour>` stages
        id: discover
        run: |
          set -euo pipefail
          list=$(grep -oE '^FROM base AS [A-Za-z0-9._-]+' environments/Dockerfile \
            | awk '{ print $4 }' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$list" = '[]' ]; then
            echo 'no environment flavours found in environments/Dockerfile' >&2
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.flavour }}
    needs: flavours
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing needs an OIDC token and the attestation API needs a
      # write scope; both are only exercised on non-pull-request publishes.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.flavours.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      # The flavour image and the orchestrator must install the same
      # @opencode/sdk, or the mounted runner fails fast on startup. Read the
      # exact version the orchestrator resolves from the lockfile.
      - name: Resolve @opencode/sdk version
        id: sdk
        run: |
          set -euo pipefail
          version=$(jq -r '.packages["node_modules/@opencode/sdk"].version' package-lock.json)
          if [ -z "$version" ] || [ "$version" = 'null' ]; then
            echo 'could not resolve @opencode/sdk from package-lock.json' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A pull request only validates the image, so it builds the runner's
      # native platform and skips the emulated arm64 leg; publishes cover both
      # supported platforms.
      - name: Select build platforms
        id: platforms
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            echo 'platforms=linux/amd64' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=linux/amd64,linux/arm64' >> "$GITHUB_OUTPUT"
          fi

      # The runner is amd64, so QEMU supplies the arm64 emulation the
      # multi-platform build needs; buildx then emits one image index per tag
      # that a host on either architecture can pull from.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # No push on pull requests, so no login is needed (and no package write
      # permission is required from fork pull requests).
      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.flavour }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.flavour }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: environments
          target: ${{ matrix.flavour }}
          # Every flavour is one image index covering both supported platforms,
          # so the pulling host's Docker selects the matching image. A pull
          # request selects the native platform only.
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCODE_SDK_VERSION=${{ steps.sdk.outputs.version }}
          # buildx attaches attestations as manifests inside the image index,
          # which would add `unknown/unknown` entries to every published tag.
          # Publish them out-of-band instead, via the steps below.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.flavour }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavour }}

      # Attach the supply-chain metadata to the published digest rather than to
      # the index: generate an SPDX SBOM from the pushed image, then sign both
      # the SBOM and the SLSA provenance with the workflow's OIDC identity and
      # push them to the registry's attestation storage.
      - name: Generate SPDX SBOM for the published image
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.flavour }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest the published SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.flavour }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest the published image's build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.flavour }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
