# Values shared by every repository; each entry states only what differs.
defaults:
  provider: github
  owner: acme
  credential: env:GITHUB_TOKEN
  baseBranch: main
  pollIntervalSeconds: 60
  maxReviseRounds: 3
  labels:
    trigger: openspec
  environment:
    image: ghcr.io/acme/agent-base:latest
    gitIdentity:
      name: OpenSpec Agent
      email: agent@example.com
repositories:
  - name: widget
  - name: gadget
    baseBranch: develop
    environment:
      image: ghcr.io/acme/agent-java:latest
      devices:
        - path: /dev/qtpy2
          description: Adafruit QT Py ESP32-S2; e-ink display and sensors wired to it
        - /dev/jtum120
      caches:
        - name: gradle
          path: /home/agent/.gradle
limits:
  maxSteps: 200
  maxTokens: 200000
  maxDurationMs: 1800000
workspace:
  root: ~/workspace
  worktrees: /tmp
logging:
  verbose: false
agent:
  # OpenCode model the embedded host runs. The default is greenpt/deepseek-v4.1-flash.
  model: greenpt/deepseek-v4.1-flash
  # API base URL for the model's provider. Omit to use the provider's registry
  # default, or set it to point at a different or self-hosted OpenAI-compatible
  # endpoint.
  # apiEndpoint: https://api.example.com/v1
  # Environment variable the provider reads its API key from (default LLM_API_KEY).
  # apiKeyEnv: LLM_API_KEY
  # Point at the OpenCode database that holds provider auth and models when it is
  # not the SDK default (or set OPENCODE_DB instead).
  # database: ~/.local/share/opencode/opencode.db
# The opt-in, read-only status overview is disabled by default; when enabled it
# binds loopback at 127.0.0.1:8787 and serves GET / (HTML) and GET /status.json
# (JSON). No authentication is provided, so expose a non-loopback host only
# behind a reverse proxy.
# status:
#   enabled: true
#   host: 127.0.0.1
#   port: 8787
