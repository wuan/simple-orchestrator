# Values shared by every repository; each entry states only what differs.
defaults:
  provider: github
  owner: acme
  credential: env:GITHUB_TOKEN
  baseBranch: main
  pollIntervalSeconds: 60
  maxReviseRounds: 3
  labels:
    trigger: openspec
  environment:
    image: ghcr.io/acme/agent-base:latest
    gitIdentity:
      name: OpenSpec Agent
      email: agent@example.com
repositories:
  - name: widget
  - name: gadget
    baseBranch: develop
    environment:
      image: ghcr.io/acme/agent-java:latest
      caches:
        - name: gradle
          path: /home/agent/.gradle
limits:
  maxSteps: 200
  maxTokens: 200000
  maxDurationMs: 1800000
workspace:
  root: ~/workspace
  worktrees: /tmp
logging:
  verbose: false
agent:
  # OpenCode model the embedded host runs. The default is greenpt/deepseek-v4.1-flash.
  model: greenpt/deepseek-v4.1-flash
  # Point at the OpenCode database that holds provider auth and models when it is
  # not the SDK default (or set OPENCODE_DB instead).
  # database: ~/.local/share/opencode/opencode.db
